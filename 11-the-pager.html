:root{--navy:#171A6B;--blue:#3C3FFF;--blue-ink:#2B2ED1;--sky:#A8AAFF;--tint:#EDEDFF;--green:#17A05D;--green-ink:#0F7343;--mint:#E6F3EC;--paper:#F5F6FF;
 --card:#FFFFFF;--ink:#10122E;--muted:#5E607C;--line:#DDDEF3;--red:#C8372D;--red-soft:#FBE9E7;--gold:#E9B949;
 --link:#0A66D8;--bubble:#E9E9EB;--wa-bg:#E9E2D8}
@media (prefers-color-scheme:dark){:root{--paper:#0E0F24;--card:#17193A;--ink:#E8E9F7;--muted:#A0A2C0;--line:#2A2D5C;--tint:#1E2152;--blue-ink:#A8AAFF;
 --mint:#16362A;--red:#EF6A5E;--red-soft:#3A1D1A;--green-ink:#5FD39A;--link:#5AA9FF;--bubble:#2C2C2E;--wa-bg:#0E1A16}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Plex",-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.7}
.k{font-family:"Kufi","Plex",sans-serif;font-weight:800}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,[role=button]:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.band{background:var(--blue);color:#fff}
.band .logo{display:block;line-height:0}.band .logo svg{height:30px;width:auto;display:block}
.band-in{max-width:520px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:10px;font-size:14px}
.band .brand{font-family:"Kufi","Plex",sans-serif;font-weight:800;font-size:18px}
.band .sep{width:1px;height:16px;background:rgba(255,255,255,.35)}
.band .gname{opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.lgslot{margin-inline-start:auto;flex:none}
.lang{border:1px solid rgba(255,255,255,.55);background:transparent;color:#fff;border-radius:20px;padding:3px 12px;font-size:13px;font-weight:700}
.sig{max-width:520px;margin:0 auto;padding:18px 18px 30px;border-top:1px solid var(--line);text-align:center;font-size:13px;color:var(--muted);line-height:1.8}
.sig .slogo{line-height:0;margin-bottom:6px}.sig .slogo svg{height:26px;width:auto}
.sig b{color:var(--ink)}.sig a{color:var(--blue);font-weight:700;text-decoration:none}.sig .dot{opacity:.5;margin:0 4px}
.review a{color:var(--blue);font-weight:700;text-decoration:none}
.sadu{height:10px;border-top:2px solid var(--sky);background:conic-gradient(from 135deg at 50% 0,var(--blue) 90deg,transparent 0) 0 0/12px 10px repeat-x}
main{max-width:520px;margin:0 auto;padding:18px 18px 56px}
/* mascot */
.mascot{display:block}
.mascot .mo{display:none}
.mascot.idle .mo.idle,.mascot.happy .mo.happy,.mascot.sad .mo.sad,.mascot.cheer .mo.happy,.mascot.cheer .mo.cheer{display:inline}
@media (prefers-reduced-motion:no-preference){
 .mascot.happy,.mascot.cheer{animation:hop .55s ease}.mascot.sad{animation:shake .4s ease}
 @keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-9px)}}
 @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}}
/* intro */
.intro{text-align:center;padding-top:4px}
.intro .mascot{width:112px;margin:0 auto 8px}
.speech{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 14px;margin:0 auto 14px;max-width:380px;font-size:15px}
.speech::before{content:"";position:absolute;top:-9px;left:50%;margin-left:-9px;border:9px solid transparent;border-top:0;border-bottom-color:var(--line)}
.speech::after{content:"";position:absolute;top:-7px;left:50%;margin-left:-8px;border:8px solid transparent;border-top:0;border-bottom-color:var(--card)}
h1.title{font-family:"Kufi","Plex",sans-serif;font-weight:800;font-size:30px;line-height:1.5;margin:0 0 2px}
.sub{color:var(--muted);margin:0 0 14px}
.rules{display:flex;justify-content:center;gap:8px;font-size:13px;margin:0 0 16px;flex-wrap:wrap}
.rules span{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:3px 10px}
.namebox{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;text-align:start}
.namebox label{font-weight:700;display:block;margin-bottom:6px}
.namebox input{width:100%;font:inherit;font-size:18px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--paper);color:var(--ink)}
.btn{display:block;width:100%;border:0;border-radius:16px;background:var(--blue);color:#fff;font-size:18px;font-weight:700;padding:15px;margin-top:12px}
.btn:disabled{opacity:.4;cursor:default}
@media (prefers-color-scheme:dark){.btn{background:var(--blue);color:#fff}}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.fine{font-size:13px;color:var(--muted);text-align:center;margin:12px 0 0}
/* hud */
.hud{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}
.beads{display:flex;gap:5px}
.bead{width:12px;height:12px;border-radius:50%;border:2px solid var(--line)}
.bead.now{border-color:var(--blue);transform:scale(1.3)}
.bead.ok{background:var(--green);border-color:var(--green)}
.bead.no{background:var(--red);border-color:var(--red)}
.count{font-size:13px;color:var(--muted);white-space:nowrap}
.ctx{font-weight:700;margin:0 0 10px;font-size:16.5px}
.hint{font-size:14px;color:var(--muted);margin:10px 0 0;text-align:center}
/* choices */
.choices{display:grid;gap:10px;margin-top:16px}
.choices.two{grid-template-columns:1fr 1fr}
.ch{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:13px 14px;font-size:16px;text-align:start;line-height:1.6;transition:opacity .2s,transform .1s}
.ch:active:not(:disabled){transform:scale(.98)}
.choices.two .ch{text-align:center;font-weight:700;font-size:18px}
.ch.good{border-color:var(--green);background:var(--mint)}
.ch.bad{border-color:var(--red);background:var(--red-soft)}
.ch.dim{opacity:.4}
.ch:disabled{cursor:default}
/* feedback */
.fb{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px 16px;border-inline-start:6px solid}
.fb.ok{border-inline-start-color:var(--green)}.fb.no{border-inline-start-color:var(--red)}
.fb-head{display:flex;align-items:center;gap:10px}
.fb-head .mascot{width:46px;flex:none}
.fb h2{margin:0;font-size:20px}
.fb.ok h2{color:var(--green-ink)}.fb.no h2{color:var(--red)}
.fb p{margin:8px 0 0}
.fb .tip{color:var(--muted);font-size:15px}
@media (prefers-reduced-motion:no-preference){.fb{animation:rise .25s ease-out}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}}
/* result */
.result{text-align:center}
.result .mascot{width:124px;margin:0 auto}
.score-beads{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:12px 0 4px}
.score-beads .bead{width:20px;height:20px}
.big{font-family:"Kufi","Plex",sans-serif;font-weight:800;font-size:25px;line-height:1.6;margin:8px 0 0}
.score-line{font-size:18px;margin:0}
.review{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px;text-align:start;margin:16px 0}
.review h3{margin:0 0 8px;font-size:16px}
.review p{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{background:var(--red-soft);color:var(--red);border-radius:20px;padding:3px 12px;font-size:14px;font-weight:700}
.ticket{margin:16px 0;border:2px dashed var(--green);border-radius:18px;padding:14px;background:var(--mint)}
.ticket small{display:block;color:var(--muted)}
.ticket .code{font-family:"Kufi","Plex",sans-serif;font-weight:800;font-size:26px;color:var(--green-ink)}
.ticket .when{font-size:13px;color:var(--muted)}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}
.confetti i{position:absolute;top:-14px;width:8px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(600deg)}}
@media (prefers-reduced-motion:reduce){.confetti{display:none}}

.mock{border-radius:22px;overflow:hidden;border:1px solid var(--line);background:var(--card)}
.url{color:var(--link);text-decoration:underline;direction:ltr;unicode-bidi:isolate;word-break:break-all}
.sms-top{padding:10px 14px;text-align:center;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.sms-top b{display:block;color:var(--ink);font-size:16px}
.sms-body{padding:16px 14px 22px}
.bubble{max-width:90%;padding:10px 14px;border-radius:18px;border-start-start-radius:6px;background:var(--bubble);font-size:16px}
.wa-top{background:#0B6B5C;color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;font-size:15px}
.avatar{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.25);flex:none;display:grid;place-items:center;font-size:17px}
.wa-body{background:var(--wa-bg);padding:16px 12px 22px}
.wa-bubble{max-width:90%;background:var(--card);padding:9px 12px 6px;border-radius:12px;border-start-start-radius:4px;font-size:16px}
.wa-time{display:block;text-align:end;font-size:11px;color:var(--muted)}
.mail-row{padding:10px 16px;border-bottom:1px solid var(--line);font-size:14px}
.mail-row .k2{color:var(--muted);margin-inline-end:6px}
.mail-subj{font-weight:700;font-size:17px}
.mail-body{padding:14px 16px 20px;font-size:16px}
.call{background:linear-gradient(#1D2A33,#0F1519);color:#fff;text-align:center;padding:24px 16px 20px}
.call-status{font-size:13px;opacity:.7}
.call-name{font-size:23px;font-weight:700;margin:4px 0 0}
.call-num{font-size:14px;opacity:.7}
.call-say{margin-top:16px;background:rgba(255,255,255,.1);border-radius:16px;padding:12px 14px;text-align:start;font-size:15.5px}
.call-say small{display:block;opacity:.65;font-size:12px;margin-bottom:2px}
.lock{background:linear-gradient(160deg,#2B2E8A,#121459);padding:20px 14px 26px;color:#fff;text-align:center}
.lock-time{font-size:46px;font-weight:300;direction:ltr;line-height:1.1}
.lock-date{font-size:14px;opacity:.8;margin-bottom:14px}
.notif{background:rgba(255,255,255,.9);color:#111;border-radius:18px;padding:11px 14px;text-align:start;font-size:15px;margin-top:8px}
.notif-head{display:flex;align-items:center;gap:8px;font-size:12px;color:#555;margin-bottom:3px}
.app-ico{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:13px;color:#fff}
.notif-head .now{margin-inline-start:auto}
.stack{position:relative}
.stack .notif.ghost{position:absolute;inset:auto 10px -8px 10px;height:20px;opacity:.55;margin:0;z-index:-1}
.meter{background:linear-gradient(#7C8A92,#56636A);padding:18px 16px 24px;text-align:center;color:#fff}
.meter-label{font-size:12px;opacity:.85;margin-bottom:12px}
.sticker{display:inline-block;background:#FFD84D;color:#1A1A1A;border-radius:10px;padding:14px 16px 12px;transform:rotate(-2.5deg);box-shadow:0 8px 16px rgba(0,0,0,.3)}
.sticker svg{display:block;width:118px;height:118px;margin:0 auto 8px;background:#fff;padding:6px;border-radius:4px}
.sticker b{font-size:15px}

.pager{width:150px;height:150px;margin:2px auto 12px;border-radius:50%;position:relative;display:grid;place-items:center;
 background:radial-gradient(circle at 35% 30%,#4A4DD6,#171A6B 70%);box-shadow:0 12px 26px rgba(23,26,107,.35),inset 0 -6px 14px rgba(0,0,0,.35)}
.pager .leds{position:absolute;inset:0}
.pager .leds i{position:absolute;left:50%;top:50%;width:11px;height:11px;margin:-5.5px;border-radius:50%;background:#2E3180;
 transform:rotate(calc(var(--k) * 30deg)) translateY(-63px)}
.pcore{width:90px;height:90px;border-radius:50%;background:#0E0F3D;color:#fff;display:grid;place-content:center;text-align:center;line-height:1.15;border:3px solid #3C3FFF}
.pcore small{font-size:11px;opacity:.8}
.pcore b{font-family:"Kufi","Plex",sans-serif;font-weight:800;font-size:30px;direction:ltr}
.pager.ring .leds i{background:#A8AAFF;box-shadow:0 0 10px #A8AAFF}
.pager.ready .leds i{background:#5BE49B;box-shadow:0 0 12px #5BE49B}
@media (prefers-reduced-motion:no-preference){
 .pager.ring{animation:buzz .12s linear 12}
 .pager.ring .leds i,.pager.ready .leds i{animation:blink .35s steps(2) infinite}
 @keyframes buzz{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(-3px,1px) rotate(-3deg)}75%{transform:translate(3px,-1px) rotate(3deg)}}
 @keyframes blink{50%{opacity:.25}}
 .notif.pop{animation:drop .35s ease-out}@keyframes drop{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:none}}}
.order{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin-bottom:12px}
.order .bar{flex:1;height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.order .bar i{display:block;height:100%;background:var(--blue);border-radius:8px}
.order b{color:var(--ink);min-width:36px;text-align:end}
.mute{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:2px 10px;font-size:14px}
.pl .wait{opacity:.8;font-size:14.5px;margin:16px 0 6px}
.situ{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 13px;margin:12px 0 0;font-size:15px}
.timer{height:7px;border-radius:7px;background:var(--line);overflow:hidden;margin:14px 0 2px}
.timer i{display:block;height:100%;width:100%;background:var(--blue)}
.timer i.low{background:var(--red)}
.ask{font-weight:700;margin:8px 0 0}
.ready-t{text-align:center}
.ready-t h2{font-family:"Kufi","Plex",sans-serif;font-weight:800;font-size:26px;margin:6px 0 4px}
.ready-t p{color:var(--muted);margin:0 0 6px}
</style></head>

function fakeQR(){const n=25,s=[];let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};

 const c=PG.ctx;if(!c||PG.mute)return;try{const n=c.currentTime;for(let k=0;k<3;k++){const o=c.createOscillator(),g=c.createGain(),s=n+k*.28;
  o.type="square";o.frequency.value=220;g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(.15,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+.2);
  o.connect(g).connect(c.destination);o.start(s);o.stop(s+.22)}}catch(e){}}
